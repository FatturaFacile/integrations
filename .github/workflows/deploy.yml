name: Release Assets

# On a published release: run the full CI, build every package and attach
# an archive of the built packages (with SHA-256 checksums) to the release.
on:
  release:
    types:
      - published
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Create release archive and checksums
        env:
          TAG: ${{ github.event.release.tag_name || 'manual' }}
        run: |
          ARCHIVE_NAME="fatturafacile-integrations-$TAG"
          find packages -type d -name dist -not -path '*/node_modules/*' -prune -print0 \
            | xargs -0 tar -czf "${ARCHIVE_NAME}.tar.gz"
          sha256sum "${ARCHIVE_NAME}.tar.gz" > SHA256SUMS
          echo "ARCHIVE=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" "$ARCHIVE" SHA256SUMS --clobber
